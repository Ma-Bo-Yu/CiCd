{% extends "base.html" %}
{% block title %}登录 — AI 学习知识工作台{% endblock %}
{% block main_class %} page-auth{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>登录</h1>
  <p class="muted">多用户本地账号，仅能访问自己的知识库与任务。</p>
  {% if error %}
  <p class="flash flash-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="auth-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>
      用户名
      <input type="text" name="username" value="{{ username }}" required autocomplete="username" autofocus>
    </label>
    <label>
      密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary">登录</button>
  </form>
  <p class="muted small">没有账号？<a href="/register">注册</a></p>
</section>
{% endblock %}
