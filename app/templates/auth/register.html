{% extends "base.html" %}
{% block title %}注册 — AI 学习知识工作台{% endblock %}
{% block main_class %} page-auth{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>注册</h1>
  <p class="muted">创建本地账号后即可管理自己的知识库。</p>
  {% if error %}
  <p class="flash flash-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/register" class="auth-form">
    <label>
      用户名
      <input type="text" name="username" value="{{ username }}" required minlength="3" maxlength="32" autocomplete="username" autofocus>
    </label>
    <label>
      密码
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>
      确认密码
      <input type="password" name="password_confirm" required minlength="6" autocomplete="new-password">
    </label>
    <button type="submit" class="btn primary">注册并登录</button>
  </form>
  <p class="muted small">已有账号？<a href="/login">登录</a></p>
</section>
{% endblock %}
