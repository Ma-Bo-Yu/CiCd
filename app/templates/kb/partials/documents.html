<div id="doc-table">
{% if documents %}
<table class="data-table">
  <thead>
    <tr>
      <th>文件名</th>
      <th>状态</th>
      <th>错误信息</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for doc in documents %}
    <tr>
      <td>{{ doc.filename }}</td>
      <td><span class="status status-{{ doc.status }}">{{ doc.status }}</span></td>
      <td class="muted-cell small">{{ doc.error_message or "—" }}</td>
      <td>
        <form
          class="inline-form"
          hx-post="/kb/{{ kb.id }}/documents/{{ doc.id }}/reindex"
          hx-target="#doc-table"
          hx-swap="outerHTML"
        >
          <button type="submit" class="btn-link">重新索引</button>
        </form>
        <form
          class="inline-form"
          hx-post="/kb/{{ kb.id }}/documents/{{ doc.id }}/delete"
          hx-target="#doc-table"
          hx-swap="outerHTML"
          hx-confirm="确定删除该文档？"
        >
          <button type="submit" class="btn-link danger">删除</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty-state">暂无文档，请上传 PDF 或 Markdown。</p>
{% endif %}
</div>
