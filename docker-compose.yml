# 阿里云 ECS 2G 内存：用 SQLite，避免再跑 MySQL 占内存
# app 目录挂载进容器：改页面/代码后只需重启，不必每次完整 build
services:
  web:
    build: .
    container_name: ai-workbench
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./chroma:/app/chroma
      - ./app.db:/app/app.db
    environment:
      DATABASE_URL: sqlite:////app/app.db
      DATA_DIR: /app/data
      CHROMA_DIR: /app/chroma
      FFMPEG_BIN_DIR: ""
    mem_limit: 1536m
